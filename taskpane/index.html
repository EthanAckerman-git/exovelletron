<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel AI Local</title>
  <link rel="stylesheet" href="/app/taskpane.css">
  <script>window.__EAL_TOKEN__ = "__EAL_SESSION_TOKEN__";</script>
  <script src="/vendor/office/office.js"></script>
</head>
<body>
  <div id="app">
    <header class="status">
      <span class="status__dot" id="dot" data-state="idle" role="status" aria-live="polite"></span>
      <span class="status__name" id="modelName">Connecting…</span>
      <span class="status__local" title="All processing happens on this Mac">on-device</span>

      <button class="status__btn" id="newChat" aria-label="New conversation" title="New conversation">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M8 3.5v9M3.5 8h9"/>
        </svg>
      </button>
      <button class="status__btn" id="settings" aria-label="About this add-in" title="About">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="8" cy="8" r="5.2"/><path d="M8 7.4v3.4M8 5.3v.2"/>
        </svg>
      </button>
    </header>

    <div class="selection">
      <span class="selection__addr" id="selAddr">—</span>
      <span class="selection__meta" id="selMeta"></span>
    </div>

    <main class="thread" id="thread" aria-live="polite"></main>

    <footer class="composer">
      <div class="composer__box">
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Connecting…" autocomplete="off"
                  spellcheck="true" enterkeyhint="send"></textarea>
        <button class="composer__send" id="send" data-mode="send" aria-label="Send message" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 13V3.5M4 7l4-3.6L12 7"/>
          </svg>
        </button>
      </div>
      <div class="composer__hint">
        <span>Enter to send · Shift+Enter for a new line</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/app/taskpane.js"></script>
</body>
</html>
