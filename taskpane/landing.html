<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel AI Local</title>
  <link rel="stylesheet" href="/app/taskpane.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .card {
      max-width: 420px; text-align: center;
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-card);
    }
    .card img { width: 56px; height: 56px; border-radius: 13px; }
    h1 { font-size: 17px; margin: 14px 0 6px; letter-spacing: -0.01em; }
    p { color: var(--ink-soft); font-size: 13px; margin: 0 0 8px; }
    .ok { color: var(--sage); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/icon-128.png" alt="">
    <h1>Excel AI Local</h1>
    <p class="ok">The local engine is running.</p>
    <p>Open Microsoft Excel and choose <strong>Excel AI Local</strong> on the Home tab.</p>
    <p class="eyebrow" style="margin-top:16px">127.0.0.1 only · nothing leaves this Mac</p>
  </div>
</body>
</html>
